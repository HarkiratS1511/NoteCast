[project]
name = "notecast"
version = "0.1.0"
description = "Local NotebookLM-style app for university course material."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "pyyaml",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "webvtt-py>=0.5.1",
    "srt>=3.5.3",
    "lancedb>=0.39.0",
    "fastembed>=0.8.1",
    "pyarrow>=25.0.1",
    "anthropic>=1.8.0",
]

[project.scripts]
notecast = "notecast.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
